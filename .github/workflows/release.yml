name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: etherdigits-windows-x64
          - os: windows-11-arm  # Windows on ARM (Snapdragon laptops)
            asset: etherdigits-windows-arm64
          - os: macos-latest
            asset: etherdigits-macos-arm64
          - os: macos-15-intel  # Intel Macs
            asset: etherdigits-macos-x64
          - os: ubuntu-22.04
            asset: etherdigits-linux-x64
          - os: ubuntu-22.04-arm  # Raspberry Pi OS 64-bit (bookworm and newer) and other ARM64 Linux
            asset: etherdigits-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Test before packaging
        run: python -m unittest -q
      - run: node --check web/app.js
      - run: pyinstaller --noconfirm packaging/etherdigits.spec
      - name: Smoke test
        shell: bash
        run: |
          ./dist/etherdigits --version
          ./dist/etherdigits voices
          ./dist/etherdigits render --random 2 -o test.wav
      - name: Pack
        shell: bash
        run: |
          cp README.md LICENSE NOTICE.md pad_tool.html dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" .
          else
            zip -r "../${{ matrix.asset }}.zip" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          notes="docs/release-notes-${GITHUB_REF_NAME#v}.md"
          [ -f "$notes" ] || echo "EtherDigits ${GITHUB_REF_NAME}" > "$notes"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            SHA256SUMS
          prerelease: true
          body_path: ${{ env.NOTES }}
